<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Capitec Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --capitec-blue: #002b49;
            --capitec-red: #e01a22;
            --capitec-light: #f4f6f8;
        }

        body {
            background-color: var(--capitec-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .navbar-capitec {
            background-color: var(--capitec-blue);
        }

        .navbar-brand {
            font-weight: 800;
            color: #ffffff !important;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e8ed;
            max-width: 480px;
            margin: auto;
        }

        .btn-capitec {
            background-color: var(--capitec-red);
            color: white;
            font-weight: 600;
        }

        .btn-capitec:hover {
            background-color: #b8141b;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-capitec">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fa-solid fa-building-columns me-2"></i>CAPITEC<span
                    style="color: var(--capitec-red);">.</span>
            </a>
            <div class="ms-auto">
                <a th:href="@{/}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-home me-1"></i> Home</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="fa-solid fa-user-plus fa-3x" style="color: var(--capitec-blue);"></i>
                </div>
                <h3 class="fw-bold" style="color: var(--capitec-blue);">Create Customer Account</h3>
                <p class="text-muted small">Register to book and manage your Capitec branch appointments</p>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${exist}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${exist}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-xmark me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/customer/create}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Sipho Nkosi" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. sipho@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. +27 82 123 4567" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter secure password"
                        required>
                </div>

                <div class="d-grid mb-3">
                    <button class="btn btn-capitec btn-lg" type="submit">Create Account</button>
                </div>

                <div class="text-center small">
                    Already registered? <a th:href="@{/customer/login}" class="fw-bold text-decoration-none"
                        style="color: var(--capitec-blue);">Log In here</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
