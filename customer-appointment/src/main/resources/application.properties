spring.application.name=customer-appointment
server.port=8080

# Disable docker compose auto-lifecycle during local dev/tests so it doesn't fail if Docker Desktop is stopped
spring.docker.compose.enabled=false

# Default DataSource: In-Memory Database with MySQL compatibility mode
# This guarantees the application starts up immediately for testing and review
spring.datasource.url=jdbc:h2:mem:customer_appointmentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
